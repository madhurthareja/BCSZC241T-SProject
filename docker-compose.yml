# Stateless local dev: every request gets its own tempdir; no persistent volume.
# Frontend nginx listens on 8080 (matches Cloud Run). Backend on 8000 internal.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: vidmark-backend:latest
    container_name: vidmark-backend
    restart: unless-stopped
    environment:
      PORT: "8000"
      VIDMARK_CORS_ORIGINS: ${VIDMARK_CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    networks:
      - vidmark-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        BACKEND_URL: http://backend:8000
    image: vidmark-frontend:latest
    container_name: vidmark-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    networks:
      - vidmark-net

networks:
  vidmark-net:
    driver: bridge
